<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url(img/background.png); background-size:cover;height:100vh; background-position: center;">
    <div style="width: 400px; height: 300px; justify-content: center; align-items: center;display: flex; flex-wrap: wrap; margin: auto;">
        <img src="img/Logo.png" alt="" style="width: 300px; height: 300px;">
    </div>
    <main>      
            <form action="" style=" border-radius: 18px; padding: 32px 36px; background-color:rgba(20, 42, 73, 0.88); border: 1px solid rgba(0, 200, 245, 0.20); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); width: 350px; height: 300px; justify-content: center; display: flex; flex-direction: column;  margin: auto; ">
                <h3 style="text-align: center; color: #F4F8FC;">Acesse sua conta</h3>
                <div style="justify-content: center; display: flex; flex-direction: column; margin:auto;">
                    <label for="" style="color: #DCE7F2;">E-mail</label>
                    <input type="email" name="" id="" placeholder="seu@email.com" style="padding: 3px 5px; border-radius: 7px; border: none;">
                    <label for="" style="margin-top: 10px; color: #DCE7F2;">Senha</label>
                    <input type="password" name="" id="" placeholder="digite sua senha" style="padding: 3px 5px; border-radius: 7px; border: none;">
                </div>
                <div style="justify-content: space-between; display: flex; ">
                    <div>   
                        <input type="checkbox" name="" id="">
                        <label for="" style="color: #DCE7F2;">Lembrar-me</label>
                    </div>
                    <a href="" style="color: #00C8F5;">Esqueceu sua senha?</a>
                </div>
                <input type="submit" value="Entrar" style="background-color: rgb(48, 153, 252); color: aliceblue; border: none; padding: 5px; border-radius: 9px; height: 30px; width: 350px; display: flex; justify-content: center; margin: 0 auto;">
                <div style="display: flex; align-items: center; gap: 15px; justify-content: center;">
                    <p style="color: #DCE7F2;">Não uma conta?</p> <a href="" style="color: #00C8F5;">Cadastre-se</a>
                </div>
            </form>
    </main>
</body>
</html>
